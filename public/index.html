<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: iPhone çentik/ana çubuk alanları env(safe-area-inset-*) ile yönetilir -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OSGB Hub" />
    <meta name="format-detection" content="telephone=no" />
    <title>%WEB_TITLE%</title>
    <!-- Kayıtlı temayı uygulama yüklenmeden uygula (açılışta renk sıçraması olmasın) -->
    <script>
      try {
        if (localStorage.getItem('osgbhub:theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <!-- react-native-web önerilen sıfırlama + iOS Safari ayarları -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        /* Safari'de lastik bant kaydırmada zemin tema renginde kalsın */
        background-color: #0a0a0b;
        color-scheme: dark;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background-color: #f4f4f1;
        color-scheme: light;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>OSGB Hub'ı kullanmak için JavaScript'i etkinleştirin.</noscript>
    <div id="root"></div>
  </body>
</html>
