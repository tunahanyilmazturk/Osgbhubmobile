<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: iPhone çentik/ana çubuk alanları env(safe-area-inset-*) ile yönetilir -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OSGB Hub" />
    <meta name="format-detection" content="telephone=no" />
    <title>%WEB_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Kayıtlı temayı uygulama yüklenmeden uygula (açılışta renk sıçraması olmasın) -->
    <script>
      try {
        if (localStorage.getItem('osgbhub:theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <!-- react-native-web önerilen sıfırlama + iOS Safari ayarları -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        /* Safari'de lastik bant kaydırmada zemin tema renginde kalsın */
        background-color: #09090b;
        color-scheme: dark;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background-color: #f5f4ef;
        color-scheme: light;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        font-family: inherit;
        box-sizing: border-box;
      }
      ::selection {
        background: rgba(255, 176, 32, 0.28);
      }
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(161, 161, 170, 0.24);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 176, 32, 0.45);
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>OSGB Hub'ı kullanmak için JavaScript'i etkinleştirin.</noscript>
    <div id="root"></div>
  </body>
</html>
